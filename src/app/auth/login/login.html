<div class="flex min-h-[calc(100vh-56px)] items-center justify-center bg-gray-50 px-4">
  <form
    class="w-full max-w-sm space-y-4 rounded-lg bg-white p-6 shadow"
    (submit)="onSubmit(); $event.preventDefault()"
  >
    <h1 class="text-2xl font-bold text-blue-600">Iniciar sesión</h1>

    @if (authService.error(); as errorMessage) {
      <p class="rounded bg-red-50 p-2 text-sm text-red-700">{{ errorMessage }}</p>
    }

    <label class="block">
      <span class="text-sm font-medium text-gray-700">Correo</span>
      <input
        type="email"
        [formField]="loginForm.email"
        class="mt-1 w-full rounded border border-gray-300 px-3 py-2"
      />
      @if (loginForm.email().touched() && loginForm.email().errors().length) {
        <span class="text-sm text-red-600">{{ loginForm.email().errors()[0].message }}</span>
      }
    </label>

    <label class="block">
      <span class="text-sm font-medium text-gray-700">Contraseña</span>
      <input
        type="password"
        [formField]="loginForm.password"
        class="mt-1 w-full rounded border border-gray-300 px-3 py-2"
      />
      @if (loginForm.password().touched() && loginForm.password().errors().length) {
        <span class="text-sm text-red-600">{{ loginForm.password().errors()[0].message }}</span>
      }
    </label>

    <button
      type="submit"
      [disabled]="loginForm().invalid() || submitting()"
      class="w-full rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="text-center text-sm text-gray-600">
      ¿No tienes cuenta?
      <a routerLink="/register" class="text-blue-600 underline">Regístrate</a>
    </p>
  </form>
</div>
